name: Build Signed Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Signed APK with Cordova & Gradle
        run: |
          npm install -g cordova
          cordova create app_build com.apkforge.aiupscaylproultima "AI Upscayl Pro   Ultimate Editio"
          cp -r www/* app_build/www/
          cd app_build
          cordova platform add android@13.0.0
          cordova build android --debug
      - name: Upload Installable Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: com.apkforge.aiupscaylproultima-v1.2.0-Installable-APK
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
